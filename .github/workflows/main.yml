name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py tests
      - name: Lint
        run: python -m flake8 app.py tests/

  docker-build:
    name: Docker Image Assembly
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --no-cache -t aceest-fitness:${{ github.sha }} .

  container-tests:
    name: Automated Testing inside Container
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t aceest-fitness:${{ github.sha }} .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:${{ github.sha }} python -m pytest -v --cov=app
